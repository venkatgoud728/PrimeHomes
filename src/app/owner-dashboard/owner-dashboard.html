<div class="container mt-5">

  <div class="d-flex justify-content-between align-items-center mb-4">

    <div>
      <h2>Owner Dashboard</h2>
      <p class="text-muted">
        Welcome, {{ ownerName }}!
      </p>
    </div>

    <a routerLink="/add-property" class="btn btn-primary">
  + Add Property
</a>

  </div>

  <div class="row">

    <!-- My Properties -->

    <div class="col-md-6 mb-4">

      <div class="card shadow-sm h-100">

        <div class="card-body">

          <h4 class="card-title">
            🏠 My Properties
          </h4>

          <p class="text-muted">
            Manage the properties you have listed.
          </p>

          <a routerLink="/my-properties" class="btn btn-outline-primary">
  View My Properties
</a>

        </div>

      </div>

    </div>


    <!-- My Inquiries -->

    <div class="col-md-6 mb-4">

      <div class="card shadow-sm h-100">

        <div class="card-body">

          <h4 class="card-title">
            📩 My Inquiries
          </h4>

          <p class="text-muted">
            View inquiries received from buyers.
          </p>

          <a routerLink="/owner-inquiries" class="btn btn-outline-success">
  View Inquiries
</a>

        </div>

      </div>

    </div>

  </div>

</div>
