<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">

    <a class="navbar-brand fw-bold" routerLink="/">
      🏠 Prime Homes
    </a>

   <button
  class="navbar-toggler"
  type="button"
  (click)="toggleMenu()">

  <span class="navbar-toggler-icon"></span>

</button>

<div
  class="navbar-collapse"
  [class.show]="menuOpen"
  id="mainNavbar">

  <div class="navbar-nav ms-auto">

      <a
  class="nav-link"
  routerLink="/"
  routerLinkActive="active"
  [routerLinkActiveOptions]="{ exact: true }">

  Home

</a>

      <!-- Properties for logged-in users -->
      <ng-container *ngIf="isLoggedIn()">

        <a
  class="nav-link"
  routerLink="/properties"
  routerLinkActive="active">

  Properties

</a>

      </ng-container>

      <!-- Show only when logged out -->
      <ng-container *ngIf="!isLoggedIn()">

        <a
  class="nav-link"
  routerLink="/login"
  routerLinkActive="active">

  Login

</a>

<a
  class="nav-link"
  routerLink="/register"
  routerLinkActive="active">

  Register

</a>

      </ng-container>

      <!-- Show only for Buyer -->
      <ng-container *ngIf="isLoggedIn() && getUserRole() === 'Buyer'">

        <a
  class="nav-link"
  routerLink="/my-inquiries"
  routerLinkActive="active">

  My Inquiries

</a>

      </ng-container>

      <!-- Show only for Owner -->
      <ng-container *ngIf="isLoggedIn() && getUserRole() === 'Owner'">

        <a
  class="nav-link"
  routerLink="/owner-dashboard"
  routerLinkActive="active">

  Dashboard

</a>

        <a
  class="nav-link"
  routerLink="/my-properties"
  routerLinkActive="active">

  My Properties

</a>

        <a
  class="nav-link"
  routerLink="/owner-inquiries"
  routerLinkActive="active">

  My Inquiries

</a>

      </ng-container>

      <!-- Show only for Admin -->
      <ng-container *ngIf="isLoggedIn() && getUserRole() === 'Admin'">

        <a
  class="nav-link"
  routerLink="/admin-dashboard"
  routerLinkActive="active">

  Admin Dashboard

</a>

      </ng-container>

      <!-- Logout -->
      <ng-container *ngIf="isLoggedIn()">

        <button
          class="btn btn-outline-light btn-sm ms-2"
          (click)="logout()">

          Logout

        </button>

      </ng-container>

    </div>

  </div>

  </div>

</nav>

<router-outlet></router-outlet>
